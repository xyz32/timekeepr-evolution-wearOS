name: Release APK

# Builds the signed release APK and publishes it as a GitHub release named vYYYY.MM-#
# (e.g. v2026.10-1) when either:
#   - a vYYYY.MM-# tag is pushed on a commit that is on master, or
#   - a commit whose message starts with "Release vYYYY.MM-#" is pushed to master as the last
#     commit of the push. The release then creates the tag on that commit.
#
# The APK is signed with the keystore in these repository secrets; the run fails without them:
#   RELEASE_KEYSTORE_BASE64    the keystore file, base64 encoded (base64 -w0 release.jks)
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    # Cheap pre-filter; the exact rules are checked below.
    if: >-
      !github.event.deleted
      && (github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'Release v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All history and tags, to check the tag is on master and the version is unused.
          fetch-depth: 0

      - name: Detect release
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version_re='v([0-9]{4}\.(0[1-9]|1[0-2])-[0-9]{1,2})'
          sha="$(git rev-parse HEAD)"
          if [ "$REF_TYPE" = tag ]; then
            if ! [[ "$REF_NAME" =~ ^${version_re}$ ]]; then
              echo "Tag $REF_NAME is not a vYYYY.MM-# version, nothing to release."
              exit 0
            fi
            tag="$REF_NAME"
            if ! git merge-base --is-ancestor "$sha" origin/master; then
              echo "::error::Tag $tag is on $sha, which is not on master."
              exit 1
            fi
          else
            # "Release v2026.10-1", optionally followed by a colon or more text.
            subject="$(git log -1 --format=%s "$sha")"
            if ! [[ "$subject" =~ ^Release\ ${version_re}([[:space:]:]|$) ]]; then
              echo "Not a release commit, nothing to release."
              exit 0
            fi
            tag="v${BASH_REMATCH[1]}"
            existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
            if [ -n "$existing" ] && [ "$existing" != "$sha" ]; then
              echo "::error::Tag $tag already exists on $existing. Use a new version, or delete that tag first."
              exit 1
            fi
            if [ -n "$existing" ]; then
              echo "Tag $tag already marks this commit, so the tag's own run releases it."
              exit 0
            fi
          fi
          echo "Releasing $tag from $sha."
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Never publish the same version from two runs at once (e.g. a re-run).
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PreleaseVersion="$VERSION"

      - name: Verify signature and collect APK
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          # Fails unless the APK is properly signed; the certificate digest is printed for checking.
          "$build_tools/apksigner" verify --print-certs "$apk"
          out="TimeKeeperEvolution-$TAG.apk"
          cp "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: TimeKeeperEvolution-${{ env.TAG }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$SHA" --title "$TAG" --generate-notes
          fi
