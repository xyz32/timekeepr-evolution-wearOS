name: Release APK

# Builds the release APK and publishes it as a GitHub release named vYYYY.MM-# (e.g. v2026.10-1)
# when either:
#   - a tag vYYYY.MM-# is pushed, or
#   - a push's latest commit message starts with vYYYY.MM-# (e.g. "v2026.10-1 New planets"). The
#     release then creates the tag on that commit.
#
# The APK is signed when these repository secrets are set, and left unsigned otherwise:
#   RELEASE_KEYSTORE_BASE64    the keystore file, base64 encoded (base64 -w0 release.jks)
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD

on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    # Cheap pre-filter; the exact format is checked below.
    if: >-
      !github.event.deleted
      && (github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            candidate="$REF_NAME"
          else
            # First word of the commit message, allowing a trailing colon ("v2026.10-1: ...").
            candidate="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1 | awk '{ print $1 }')"
            candidate="${candidate%:}"
          fi
          if [[ "$candidate" =~ ^v([0-9]{4}\.(0[1-9]|1[0-2])-[0-9]{1,2})$ ]]; then
            echo "Releasing $candidate"
            echo "tag=$candidate" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "'$candidate' is not a vYYYY.MM-# version, nothing to release."
          fi

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A tag and a commit message for the same version both resolve here; run them one at a time.
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set, so the APK is unsigned and cannot be installed."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PreleaseVersion="$VERSION"

      - name: Collect APK
        id: apk
        run: |
          # app-release.apk when signed, app-release-unsigned.apk otherwise.
          apk="$(ls app/build/outputs/apk/release/*.apk)"
          suffix=""
          case "$apk" in *-unsigned.apk) suffix="-unsigned" ;; esac
          out="TimeKeeperEvolution-$TAG$suffix.apk"
          cp "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: TimeKeeperEvolution-${{ env.TAG }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
